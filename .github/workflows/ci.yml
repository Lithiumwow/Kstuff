name: Rebuild With New SDK

on:
  push:
    paths-ignore:
      - "**/*.md"
      - '**/*.txt'
  pull_request:
    paths-ignore:
      - "**/*.md"
      - '**/*.txt'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.event_name  }}
  cancel-in-progress: true

jobs:
  payload-build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:22.04
      options: --platform linux/amd64
    steps:

    - name: Install Git (required for checkout with submodules)
      run: |
        apt-get update
        apt-get install -y git

    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Verify x86_64 runner
      run: |
        uname -m
        [ "$(uname -m)" = "x86_64" ] || { echo "ERROR: build requires x86_64 runner"; exit 1; }

    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y build-essential xxd yasm nasm python3

    - name: Build lib (before toolchain, x86_64 only)
      run: |
        cd lib
        make clean
        make CC=/usr/bin/gcc LD=/usr/bin/ld
        file dl.o crt.o rfork.o syscalls.o lib.a lib-elf-ps5.a
        cd ..

    - name: Install toolchain
      run: |
        wget -q https://github.com/ps5-payload-dev/pacbrew-repo/releases/latest/download/ps5-payload-dev.tar.gz
        tar xf ps5-payload-dev.tar.gz -C /

    - name: Build Payload
      run: |
        export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
        bash ci-ps5-kstuff-ldr.sh

    - name: Upload Payload
      uses: actions/upload-artifact@v4
      with:
        name: Payload
        path: ./ps5-kstuff-ldr/kstuff.elf
        if-no-files-found: error
